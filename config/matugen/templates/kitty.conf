# Generated by matugen (template "kitty" -> ~/.config/kitty/colors.conf).
#
# ANSI colors are built from the Material You semantic tokens rather than
# the raw base16/wal palette: base16 tracks the source image's own
# luminance with no contrast floor, so a dark wallpaper (e.g. a night sky
# or a near-black photo) produces near-black text on a near-black
# background. The Material tokens are tone-guaranteed by the color scheme
# itself (primary/secondary/tertiary/error and their "on_*_container"
# pairs are always light in dark mode), so terminal text stays legible
# no matter how dark or muted the wallpaper is.

cursor {{colors.primary.default.hex}}

background {{colors.background.default.hex}}
foreground {{colors.on_background.default.hex}}

