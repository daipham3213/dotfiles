source = ~/.config/wallust/wal_hyprland.conf

monitor = , prefered, auto-left, 1

env = XCURSOR_THEME,
env = XCURSOR_SIZE,16
env = HYPRCURSOR_THEME,
env = HYPRCURSOR_SIZE,16

$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun
$browser = firefox
$mainMod = SUPER

exec-once = systemctl --user start hyprpolkitagent
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = awww-daemon & sleep 0.5 && awww clear
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = bash ~/.config/scripts/media.sh
exec-once = waybar
exec-once = fcitx5 -d


general {
    gaps_in = 5 # @dynamic_gaps_in
    gaps_out = 10 # @dynamic_gaps_out
    border_size = 2 # @dynamic_border
    resize_on_border = 0
    col.active_border = $color2
    allow_tearing = 0
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0
    active_opacity = 1
    inactive_opacity = 1
    shadow {
        enabled = 1
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = 1
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = hard, 0, 1, 0, 1
    animation = global, 1, 5, default
    animation = border, 1, 2.5, easeOutQuint
    animation = windows, 1, 2.5, easeOutQuint
    animation = windowsIn, 1, 2, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1, linear, popin 87%
    animation = fadeIn, 1, 1, almostLinear
    animation = fadeOut, 1, 1, almostLinear
    animation = fade, 1, 1.5, quick
    animation = layers, 1, 2, easeOutQuint
    animation = layersIn, 1, 2, easeOutQuint, fade
    animation = layersOut, 1, 1, linear, fade
    animation = workspaces, 1, 1.94, almostLinear, fade # @dynamic_workspaces
    animation = specialWorkspace, 1, 1.94, almostLinear, fade # @dynamic_special
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    force_no_accel = 0
    numlock_by_default = true
    touchpad {
        natural_scroll = 0
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = 1
    disable_splash_rendering = 1
    initial_workspace_tracking = 1
}

dwindle {
    preserve_split = 1
}

windowrule = float 1, match:tag floating-window
windowrule = center 1, match:tag floating-window
windowrule = size 800 600, match:tag floating-window
windowrule = tag +floating-window, match:class ^(local\.xdg-desktop-portal-gtk|local\.sublime_text|local\.DesktopEditors|local\.org\.gnome\.Nautilus)$, match:title ^(Open.*Files?|Open [Ff]older.*|Save.*Files?|Save.*As|Save|All Files)$

# CLI tools
windowrule = float 1, match:class ^(local\.bluetui|local\.impala|local\.wiremix|local\.org\.gnome\.NautilusPreviewer|local\.com\.gabm\.satty)$
windowrule = center 1, match:class ^(local\.bluetui|local\.impala|local\.wiremix|local\.org\.gnome\.NautilusPreviewer|local\.com\.gabm\.satty)$
windowrule = size 800 600, match:class ^(local\.bluetui|local\.impala|local\.wiremix|local\.org\.gnome\.NautilusPreviewer|local\.com\.gabm\.satty)$

# Floating generic class
windowrule = float 1, match:class ^(local\.floating)$
windowrule = center 1, match:class ^(local\.floating)$
windowrule = size 800 600, match:class ^(local\.floating)$

windowrule {
   name = mv
   match:initial_class = ^(imv|mpv|wiremix|impala)$
   float = on
   center = on
   size = 600 600
}

